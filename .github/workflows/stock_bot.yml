name: 台股 TG Bot

on:
  schedule:
    - cron: '0 0 * * 1-5'
    - cron: '0 7 * * 1-5'

  workflow_dispatch:
    inputs:
      mode:
        description: '選擇模式'
        required: true
        default: 'premarket'
        type: choice
        options:
          - premarket
          - postmarket

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 安裝中文字型
        run: |
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra
          fc-cache -fv

      - name: 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 清除 matplotlib 字型快取
        run: |
          python3 -c "
          import matplotlib, os
          cache = matplotlib.get_cachedir()
          removed = 0
          for f in os.listdir(cache):
              if f.endswith('.json') or f.endswith('.pkl'):
                  os.remove(os.path.join(cache, f))
                  removed += 1
          print(f'清除 {removed} 個快取檔，路徑: {cache}')
          "

      - name: 設定執行模式
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "MODE=${{ github.event.inputs.mode }}" >> $GITHUB_ENV
          elif [ "${{ github.event.schedule }}" = "0 0 * * 1-5" ]; then
            echo "MODE=premarket" >> $GITHUB_ENV
          else
            echo "MODE=postmarket" >> $GITHUB_ENV
          fi

      - name: 執行 Bot
        env:
          MODE: ${{ env.MODE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python main.py
